<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>CHiPSET — NIGHT HUNT</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #030202;
      --amber: #FFB000;
      --amber-dim: #9a6a00;
      --hot: #FF7A00;
      --blood: #c40000;
      --panel: #0e0802;
      --line: #3b2a00;
      --bg-dark: #030202;
      --card-bg: #0e0802;
      --card-border: #3b2a00;
      --chipset-orange: #FFB000;
      --chipset-orange-glow: rgba(255, 122, 0, 0.55);
      --scary-red: #c40000;
      --scary-red-glow: rgba(196, 0, 0, 0.5);
      --text-main: #FFB000;
      --text-muted: #c48a20;
      --font-stack: 'Oswald', Impact, sans-serif;
      --display: 'Creepster', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--amber);
      font-family: var(--font-stack);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,122,0,.20), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(196,0,0,.16), transparent 55%),
        var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 0 16px 80px;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.92) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background: rgba(255,160,40,.16);
      opacity: 0;
      animation: surge 9s infinite;
    }

    .deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .fog {
      position: absolute;
      left: -30%;
      width: 160%;
      height: 40%;
      background: radial-gradient(ellipse at center, rgba(255,140,40,.10), transparent 65%);
      filter: blur(18px);
      animation: drift 22s linear infinite;
    }
    .fog.f1 { bottom: -8%; }
    .fog.f2 { bottom: 18%; animation-duration: 34s; animation-direction: reverse; opacity: .7; }
    .drip { position: absolute; top: 0; left: 0; width: 100%; height: 90px; opacity: .9; }
    .web { position: absolute; width: 150px; height: 150px; opacity: .55; color: #d8c7a0; }
    .web.tl { top: 0; left: 0; }
    .web.tr { top: 0; right: 0; transform: scaleX(-1); }
    .fb {
      position: absolute;
      color: var(--amber);
      opacity: .22;
      filter: drop-shadow(0 0 8px var(--hot));
      animation: bflick 4s infinite, bfloat 9s ease-in-out infinite;
    }
    .fb svg { width: 100%; height: 100%; display: block; }
    .fb.b1 { width: 70px; left: 4%; top: 24%; animation-delay: .3s, 0s; }
    .fb.b2 { width: 54px; right: 5%; top: 38%; animation-delay: 1.7s, 2s; opacity: .18; }
    .fb.b3 { width: 90px; left: -14px; bottom: 10%; animation-delay: 2.4s, 1s; opacity: .16; }
    .fb.b4 { width: 64px; right: 3%; bottom: 7%; animation-delay: .9s, 3s; }
    .fb.b5 { width: 40px; left: 42%; top: 52%; animation-delay: 3.1s, 4s; opacity: .08; }
    .eyes { position: absolute; display: flex; gap: 10px; animation: blink 7s infinite; }
    .eyes i {
      display: block;
      width: 12px;
      height: 6px;
      border-radius: 50%;
      background: var(--blood);
      box-shadow: 0 0 10px 3px rgba(255,30,0,.8);
    }
    .eyes.e1 { left: 9%; top: 68%; }
    .eyes.e2 { right: 10%; top: 16%; animation-delay: 3s; transform: scale(.8); }
    .eyes.e3 { left: 30%; bottom: 3%; animation-delay: 5s; transform: scale(.6); }

    .container {
      position: relative;
      z-index: 2;
      max-width: 520px;
      margin: 0 auto;
      padding-top: 6px;
    }

    .brand-mark {
      text-align: center;
      padding-top: 10px;
      margin-bottom: 4px;
    }
    .brand-mark .logo {
      width: 104px;
      height: 124px;
      margin: 0 auto;
      color: var(--amber);
      filter: drop-shadow(0 0 10px var(--hot)) drop-shadow(0 0 28px rgba(255,122,0,.7));
      animation: logoflick 3.4s infinite;
    }
    .brand-mark .logo svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .brand-mark .word {
      font-family: var(--display);
      font-size: 34px;
      letter-spacing: 7px;
      margin-top: 2px;
      color: var(--amber);
      -webkit-text-stroke: 0.8px var(--amber);
      paint-order: stroke fill;
      text-shadow: 0 0 10px var(--hot), 0 0 26px rgba(255,122,0,.7);
      animation: logoflick 3.4s infinite;
      animation-delay: .15s;
    }
    .brand-mark .word span { color: var(--blood); text-shadow: 0 0 12px #f00; }

    .header {
      text-align: center;
      margin-bottom: 18px;
      padding: 12px 8px 0;
    }

    .brand {
      font-family: var(--display);
      font-size: 64px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 2px;
      color: var(--amber);
      text-transform: none;
      -webkit-text-stroke: 1.2px var(--amber);
      paint-order: stroke fill;
      text-shadow: 0 0 12px var(--hot), 0 0 32px rgba(255,122,0,.6), 0 4px 0 rgba(196,0,0,.85);
      animation: flicker 5s infinite;
    }

    .sub-brand {
      font-size: 1.05rem;
      color: var(--hot);
      letter-spacing: 5px;
      font-weight: 700;
      margin-top: 8px;
      text-shadow: 0 0 10px rgba(255,122,0,.6);
    }

    h2, h3, h4 {
      font-family: var(--display);
      font-weight: 400;
      letter-spacing: 2px;
      -webkit-text-stroke: 0.7px currentColor;
      paint-order: stroke fill;
    }

    .card {
      background:
        linear-gradient(180deg, rgba(255,176,0,.08), transparent 28%),
        linear-gradient(180deg, #161005 0%, #0a0502 100%);
      border: 3px solid var(--amber-dim);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow:
        inset 0 1px 0 rgba(255,176,0,.22),
        inset 0 0 28px rgba(0,0,0,.55),
        0 10px 28px rgba(0,0,0,.55),
        0 0 18px rgba(255,122,0,.12);
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.95rem;
      color: var(--hot);
      letter-spacing: 2.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      height: 64px;
      padding: 0 18px;
      background: #050300;
      border: 3px solid var(--amber);
      border-radius: 14px;
      color: var(--amber);
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      outline: none;
      box-shadow:
        inset 0 3px 10px rgba(0,0,0,.7),
        0 0 12px rgba(255,176,0,.18);
      appearance: none;
      -webkit-appearance: none;
    }

    select {
      background-image:
        linear-gradient(45deg, transparent 50%, var(--amber) 50%),
        linear-gradient(135deg, var(--amber) 50%, transparent 50%);
      background-position:
        calc(100% - 22px) 28px,
        calc(100% - 16px) 28px;
      background-size: 7px 7px, 7px 7px;
      background-repeat: no-repeat;
      padding-right: 44px;
    }

    input:focus, select:focus {
      border-color: var(--hot);
      box-shadow:
        inset 0 3px 10px rgba(0,0,0,.7),
        0 0 0 3px rgba(255,122,0,.25),
        0 0 22px rgba(255,176,0,.55);
    }

    input::placeholder { color: var(--amber-dim); font-weight: 500; }

    select option { background: #050300; color: var(--amber); }

    .btn {
      width: 100%;
      min-height: 64px;
      padding: 16px 18px;
      border: 3px solid transparent;
      border-radius: 14px;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
    }

    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active { transform: translateY(3px); filter: brightness(0.96); }

    .btn-orange {
      background: linear-gradient(180deg, #ffd056 0%, var(--amber) 42%, #d47800 100%);
      color: #1a0b00;
      border-color: #ffe08a;
      box-shadow:
        inset 0 2px 0 rgba(255,255,220,.45),
        0 5px 0 #7a2a00,
        0 0 22px rgba(255,122,0,.5);
    }
    .btn-orange:active {
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,.35),
        0 1px 0 #7a2a00,
        0 0 12px rgba(255,122,0,.4);
    }

    .btn-red {
      background: linear-gradient(180deg, #ff9a3a 0%, var(--hot) 45%, #c43000 100%);
      color: #1a0500;
      border-color: #ffc48a;
      box-shadow:
        inset 0 2px 0 rgba(255,230,200,.4),
        0 5px 0 #6a1000,
        0 0 22px rgba(255,80,0,.5);
    }
    .btn-red:active {
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,.35),
        0 1px 0 #6a1000,
        0 0 12px rgba(255,80,0,.4);
    }

    .btn-dark {
      background:
        linear-gradient(180deg, rgba(255,176,0,.16), rgba(255,176,0,.05));
      color: var(--amber);
      border-color: var(--amber);
      box-shadow:
        inset 0 1px 0 rgba(255,176,0,.25),
        0 4px 0 #3b2200,
        0 0 14px rgba(255,176,0,.18);
    }
    .btn-dark:active {
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,.45),
        0 1px 0 #3b2200;
    }

    .hunt-banner {
      background:
        linear-gradient(180deg, rgba(196,0,0,.22), transparent 40%),
        #090000;
      border: 3px solid var(--blood);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow:
        inset 0 1px 0 rgba(255,80,40,.25),
        0 0 24px rgba(196,0,0,.5),
        inset 0 0 20px rgba(196,0,0,.2);
    }

    .hunt-banner .hunters-label {
      font-family: var(--display);
      font-size: 34px;
      font-weight: 400;
      color: #ff3a1a;
      letter-spacing: 2px;
      -webkit-text-stroke: 0.8px #ff3a1a;
      paint-order: stroke fill;
      text-shadow: 0 0 12px rgba(255,30,0,.8);
    }

    .timer-display {
      font-family: var(--display);
      font-size: min(22vw, 96px);
      font-weight: 400;
      color: var(--amber);
      -webkit-text-stroke: 1.4px var(--amber);
      paint-order: stroke fill;
      text-shadow: 0 0 20px var(--hot), 0 0 40px rgba(196,0,0,.6);
      animation: pulse 1s infinite;
      margin: 10px 0;
      line-height: 1;
    }

    .hunter-pill {
      display: inline-block;
      background: rgba(255,176,0,.1);
      color: var(--amber);
      font-weight: 700;
      padding: 6px 12px;
      border: 2px solid var(--amber-dim);
      border-radius: 999px;
      font-size: 1rem;
      margin: 3px;
    }

    .team-card {
      background:
        linear-gradient(180deg, rgba(255,176,0,.07), transparent 40%),
        #100802;
      border: 3px solid var(--amber-dim);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow:
        inset 0 1px 0 rgba(255,176,0,.18),
        0 6px 16px rgba(0,0,0,.4);
    }

    .team-card.caught {
      opacity: .55;
      border-style: dashed;
      border-color: var(--blood);
      background: #0c0404;
    }

    .team-title {
      font-family: var(--display);
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--amber);
      -webkit-text-stroke: 0.6px var(--amber);
      paint-order: stroke fill;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .team-card.caught .team-title { text-decoration: line-through; }

    .member-list {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .badge-batch {
      background: #140c04;
      border: 2px solid var(--amber-dim);
      color: var(--amber);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,176,0,.15);
    }

    .status-badge {
      font-family: var(--font-stack);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }

    .status-hiding { background: rgba(255,122,0,.12); color: var(--hot); border: 2px solid var(--hot); }
    .status-pending { background: #3B2A0D; color: #FFB703; border: 2px solid #FFB703; }
    .status-caught { background: #3B0D11; color: #ff3a1a; border: 2px solid var(--blood); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      background:
        linear-gradient(180deg, rgba(255,176,0,.1), transparent 30%),
        linear-gradient(180deg, #181005, #0a0502);
      border: 3px solid var(--amber);
      border-radius: 18px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        inset 0 1px 0 rgba(255,176,0,.28),
        0 0 28px rgba(255,122,0,.35),
        0 16px 40px rgba(0,0,0,.7);
      position: relative;
      z-index: 1001;
    }

    .connection-status {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: var(--hot);
    }

    .hidden { display: none !important; }

    @keyframes flicker {
      0%,18%,22%,25%,53%,57%,100% { opacity: 1; }
      20%,24%,55% { opacity: .35; }
    }
    @keyframes logoflick {
      0%,12%,16%,19%,44%,48%,70%,100% { opacity: 1; }
      14% { opacity: .15; }
      17% { opacity: .5; }
      46% { opacity: .08; }
      71% { opacity: .4; }
      73% { opacity: .9; }
      75% { opacity: .2; }
    }
    @keyframes bflick {
      0%,10%,14%,40%,44%,100% { opacity: .22; }
      12%,42% { opacity: .04; }
      60% { opacity: .3; }
    }
    @keyframes bfloat {
      0%,100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-18px) rotate(5deg); }
    }
    @keyframes drift { from { transform: translateX(-8%); } to { transform: translateX(8%); } }
    @keyframes blink { 0%,90%,100% { opacity: 0; } 92%,96% { opacity: 1; } 94% { opacity: 0; } }
    @keyframes surge { 0%,93%,100% { opacity: 0; } 94% { opacity: 1; } 95% { opacity: .1; } 96% { opacity: .8; } 98% { opacity: 0; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

    @media (prefers-reduced-motion: reduce) {
      h1, .brand, .timer-display, .brand-mark .logo, .brand-mark .word, .fb, .fog, .eyes, body::before { animation: none; }
      .eyes { opacity: 0; }
    }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="bulb" viewBox="0 0 120 150">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="6" d="M60 18 C36 18 18 36 18 58 C18 73 27 83 35 93 C40 99 41 104 41 110 L79 110 C79 104 80 99 85 93 C93 83 102 73 102 58 C102 36 84 18 60 18Z"/>
        <path stroke-width="4" d="M60 110 V88 M60 88 L47 76 V56 M60 88 L74 74 V50 M60 98 L52 90 M47 76 L40 68"/>
        <path stroke-width="5" d="M45 118 H75 M47 128 H73 M52 138 H68"/>
        <path stroke-width="5" d="M60 2 V10 M20 14 L25 22 M100 14 L95 22 M4 44 L12 47 M116 44 L108 47 M8 78 L16 74 M112 78 L104 74"/>
      </g>
      <g fill="currentColor">
        <circle cx="47" cy="52" r="6"/><circle cx="74" cy="46" r="5"/><circle cx="40" cy="66" r="4"/>
        <circle cx="82" cy="72" r="5"/><circle cx="60" cy="88" r="3"/>
      </g>
    </symbol>
    <symbol id="web" viewBox="0 0 150 150">
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <path d="M0 0 L150 0 M0 0 L0 150 M0 0 L120 110 M0 0 L60 145 M0 0 L145 60"/>
        <path d="M30 0 Q22 22 0 30 M60 0 Q46 46 0 60 M90 0 Q70 70 0 90 M120 0 Q94 94 0 120"/>
      </g>
    </symbol>
  </svg>

  <div class="deco" aria-hidden="true">
    <div class="fog f1"></div>
    <div class="fog f2"></div>
    <svg class="drip" viewBox="0 0 400 90" preserveAspectRatio="none">
      <path fill="#8a0000" d="M0 0H400V14 C390 14 388 40 380 40 C372 40 372 14 360 14 C345 14 346 62 336 62 C326 62 330 14 310 14 C296 14 298 30 290 30 C282 30 284 14 262 14 C246 14 250 52 240 52 C230 52 232 14 210 14 C196 14 198 34 190 34 C182 34 184 14 160 14 C146 14 148 70 138 70 C128 70 130 14 110 14 C96 14 98 28 90 28 C82 28 84 14 60 14 C46 14 48 46 38 46 C28 46 30 14 12 14 C6 14 4 22 0 22Z"/>
    </svg>
    <svg class="web tl"><use href="#web"/></svg>
    <svg class="web tr"><use href="#web"/></svg>
    <div class="fb b1"><svg viewBox="0 0 120 150"><use href="#bulb"/></svg></div>
    <div class="fb b2"><svg viewBox="0 0 120 150"><use href="#bulb"/></svg></div>
    <div class="fb b3"><svg viewBox="0 0 120 150"><use href="#bulb"/></svg></div>
    <div class="fb b4"><svg viewBox="0 0 120 150"><use href="#bulb"/></svg></div>
    <div class="fb b5"><svg viewBox="0 0 120 150"><use href="#bulb"/></svg></div>
    <div class="eyes e1"><i></i><i></i></div>
    <div class="eyes e2"><i></i><i></i></div>
    <div class="eyes e3"><i></i><i></i></div>
  </div>

  <div class="container">
    <div class="brand-mark" aria-hidden="true">
      <div class="logo"><svg viewBox="0 0 120 150"><use href="#bulb"/></svg></div>
      <div class="word">CH<span>i</span>PSET</div>
    </div>

    <header class="header">
      <div class="brand">CHiPSET</div>
      <div class="sub-brand">NIGHT HUNT • LIVE ARENA</div>
    </header>

    <div id="connectionStatus" class="connection-status">CONNECTING TO LIVE SERVER...</div>

    <!-- STEP 1: USER REGISTRATION -->
    <section id="stepRegister" class="card">
      <h2 style="color: var(--chipset-orange); margin-bottom: 16px; font-size: 34px; text-align: center; text-shadow: 0 0 14px rgba(255,122,0,.7), 0 2px 0 rgba(196,0,0,.6);">ENTER THE HUNT</h2>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="inputName" placeholder="Enter full name" />
      </div>
      <div class="form-group">
        <label>CHiPSET Batch</label>
        <select id="selectBatch">
          <option value="2024-25">Batch 2024-25</option>
          <option value="2025-26">Batch 2025-26</option>
          <option value="2026-27">Batch 2026-27</option>
        </select>
      </div>
      <button class="btn btn-orange" onclick="registerUser()">JOIN ARENA</button>
    </section>

    <!-- STEP 2: MAIN LIVE GAME DASHBOARD -->
    <main id="stepDashboard" class="hidden">
      <!-- LIVE HUNT STATUS BANNER -->
      <div id="huntBanner" class="hunt-banner">
        <div class="hunters-label">☠ HUNTERS ☠</div>
        <div id="hunterNamesList" style="margin-top: 6px;"></div>
      </div>

      <!-- TIMER DISPLAY -->
      <div id="timerCard" class="card hidden" style="text-align: center;">
        <div id="timerLabel" style="font-size: 0.85rem; letter-spacing: 3px; color: var(--text-muted);">TIME REMAINING</div>
        <div id="timerDisplay" class="timer-display">00:00</div>
      </div>

      <!-- TEAMS / PLAYERS DISPLAY -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="font-size: 28px; color: var(--chipset-orange);">ARENA STATUS</h3>
          <span id="playerCountBadge" style="font-size: 0.8rem; color: var(--text-muted);">0 Joined</span>
        </div>

        <div id="lobbyView" style="color: var(--text-muted); font-size: 0.9rem;">
          <p>Waiting for supervisor to initiate the hunt...</p>
          <div id="lobbyPlayerList" style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px;"></div>
        </div>

        <div id="activeTeamsList" class="hidden"></div>
      </div>

      <button class="btn btn-dark" onclick="openSupervisorModal()">
        🔐 SUPERVISOR ACCESS
      </button>
    </main>
  </div>

  <!-- SUPERVISOR MODAL -->
  <div id="supervisorModal" class="modal">
    <div class="modal-content">
      <h3 style="color: var(--chipset-orange); margin-bottom: 16px; font-size: 32px;">SUPERVISOR PANEL</h3>
      
      <div id="passcodeSection">
        <div class="form-group">
          <label>Enter Passcode</label>
          <input type="password" id="inputPasscode" placeholder="••••" />
        </div>
        <button class="btn btn-orange" onclick="verifyPasscode()">UNLOCK</button>
        <button class="btn btn-dark" onclick="closeSupervisorModal()" style="margin-top: 8px;">CANCEL</button>
      </div>

      <div id="supervisorControls" class="hidden">
        <div style="margin-bottom: 16px; font-size: 0.85rem; color: var(--text-muted);">
          Passcode Verified • Supervisor Access Granted
        </div>

        <button class="btn btn-orange" onclick="startNewGame()" style="margin-bottom: 12px;">
          ⚡ START GAME (ASSIGN ROLES)
        </button>

        <div id="pendingApprovalsList" style="margin-top: 16px;"></div>

        <button class="btn btn-red" onclick="resetGame()" style="margin-top: 16px;">
          ⚠️ RESET ENTIRE GAME
        </button>
        <button class="btn btn-dark" onclick="closeSupervisorModal()" style="margin-top: 8px;">
          CLOSE PANEL
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CREDENTIALS PRE-CONFIGURED
    // ==========================================
    const SUPABASE_URL = "https://uvqxtfwcskyyisdpuycv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2cXh0Zndjc2t5eWlzZHB1eWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODU1NjgsImV4cCI6MjEwNjk2MTU2OH0.aGfSOZiWjxo7Zfbat9F4VKeVySVjHJ75-er3smCKisE";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TEAM_NAMES = [
      "PHANTOM SPECTRES", "SHADOW VENOM", "VOID RUNNERS", "CYBER REAPERS", 
      "NIGHT STALKERS", "OBSIDIAN VIPERS", "DARK PROTOCOL", "BLOODHUNTERS"
    ];

    let state = {
      status: 'LOBBY',
      players: [],
      seekers: [],
      teams: [],
      timerEndTime: null
    };

    let localPlayer = JSON.parse(localStorage.getItem('chipset_player')) || null;
    const SUPERVISOR_PASSCODE = '1121';

    // ==========================================
    // 2. REALTIME ENGINE & INIT
    // ==========================================
    async function initApp() {
      if (localPlayer) {
        document.getElementById('stepRegister').classList.add('hidden');
        document.getElementById('stepDashboard').classList.remove('hidden');
      }

      const { data, error } = await supabaseClient
        .from('game_room')
        .select('state_data')
        .eq('id', 1)
        .single();

      if (data && data.state_data) {
        state = data.state_data;
        updateUI();
      }

      document.getElementById('connectionStatus').innerText = '🔴 LIVE SYNC ACTIVE';

      supabaseClient
        .channel('public:game_room')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_room' }, payload => {
          if (payload.new && payload.new.state_data) {
            state = payload.new.state_data;
            updateUI();
          }
        })
        .subscribe();

      setInterval(tickTimer, 1000);
    }

    async function syncToSupabase() {
      await supabaseClient
        .from('game_room')
        .update({ state_data: state, updated_at: new Date() })
        .eq('id', 1);
    }

    // ==========================================
    // 3. USER ACTIONS
    // ==========================================
    async function registerUser() {
      const name = document.getElementById('inputName').value.trim();
      const batch = document.getElementById('selectBatch').value;

      if (!name) {
        alert("Please enter your name!");
        return;
      }

      localPlayer = { id: 'p_' + Date.now(), name, batch };
      localStorage.setItem('chipset_player', JSON.stringify(localPlayer));

      if (!state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        state.players.push(localPlayer);
        await syncToSupabase();
      }

      document.getElementById('stepRegister').classList.add('hidden');
      document.getElementById('stepDashboard').classList.remove('hidden');
      updateUI();
    }

    async function claimCaught(teamId) {
      const team = state.teams.find(t => t.id === teamId);
      if (team) {
        team.status = 'PENDING';
        await syncToSupabase();
        alert(`Catch claimed for ${team.name}! Awaiting supervisor approval.`);
      }
    }

    // ==========================================
    // 4. SUPERVISOR ACTIONS
    // ==========================================
    function openSupervisorModal() {
      document.getElementById('supervisorModal').classList.add('active');
    }

    function closeSupervisorModal() {
      document.getElementById('supervisorModal').classList.remove('active');
    }

    function verifyPasscode() {
      const code = document.getElementById('inputPasscode').value;
      if (code === SUPERVISOR_PASSCODE) {
        document.getElementById('passcodeSection').classList.add('hidden');
        document.getElementById('supervisorControls').classList.remove('hidden');
      } else {
        alert("Incorrect Passcode!");
      }
    }

    async function startNewGame() {
      if (state.players.length < 4) {
        alert("Need at least 4 players (3 Seekers + Hiders)!");
        return;
      }

      let shuffled = [...state.players].sort(() => Math.random() - 0.5);

      const seekerObjs = shuffled.slice(0, 3);
      state.seekers = seekerObjs.map(s => s.name);

      let hiders = shuffled.slice(3);

      let b24 = hiders.filter(h => h.batch === '2024-25');
      let b25 = hiders.filter(h => h.batch === '2025-26');
      let b26 = hiders.filter(h => h.batch === '2026-27');

      let mixedHiders = [];
      while (b24.length || b25.length || b26.length) {
        if (b24.length) mixedHiders.push(b24.pop());
        if (b25.length) mixedHiders.push(b25.pop());
        if (b26.length) mixedHiders.push(b26.pop());
      }

      state.teams = [];
      let nameIndex = 0;
      for (let i = 0; i < mixedHiders.length; i += 3) {
        let teamMembers = mixedHiders.slice(i, i + 3);
        let tName = TEAM_NAMES[nameIndex % TEAM_NAMES.length] + " " + (Math.floor(nameIndex / TEAM_NAMES.length) + 1);
        nameIndex++;

        state.teams.push({
          id: 't_' + Date.now() + '_' + i,
          name: tName,
          members: teamMembers,
          status: 'HIDING'
        });
      }

      state.status = 'COUNTDOWN';
      state.timerEndTime = Date.now() + 10000;

      await syncToSupabase();
      closeSupervisorModal();
    }

    async function approveCatch(teamId) {
      const team = state.teams.find(t => t.id === teamId);
      if (team) {
        team.status = 'CAUGHT';
        team.members.forEach(m => {
          if (!state.seekers.includes(m.name)) {
            state.seekers.push(m.name);
          }
        });
        await syncToSupabase();
      }
    }

    async function resetGame() {
      if (confirm("Reset game state to Lobby?")) {
        state.status = 'LOBBY';
        state.seekers = [];
        state.teams = [];
        state.timerEndTime = null;
        await syncToSupabase();
        closeSupervisorModal();
      }
    }

    // ==========================================
    // 5. RENDER & TIMER LOOPS
    // ==========================================
    function updateUI() {
      const lobbyList = document.getElementById('lobbyPlayerList');
      lobbyList.innerHTML = state.players.map(p => 
        `<span class="badge-batch">${p.name} (${p.batch})</span>`
      ).join('');

      document.getElementById('playerCountBadge').innerText = `${state.players.length} Joined`;

      const hunterBox = document.getElementById('hunterNamesList');
      if (state.seekers.length === 0) {
        hunterBox.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">No Hunters Assigned Yet</span>`;
      } else {
        hunterBox.innerHTML = state.seekers.map(name => `<span class="hunter-pill">💀 ${name}</span>`).join('');
      }

      if (state.status === 'LOBBY') {
        document.getElementById('lobbyView').classList.remove('hidden');
        document.getElementById('activeTeamsList').classList.add('hidden');
        document.getElementById('timerCard').classList.add('hidden');
      } else {
        document.getElementById('lobbyView').classList.add('hidden');
        document.getElementById('activeTeamsList').classList.remove('hidden');
        document.getElementById('timerCard').classList.remove('hidden');
        renderTeams();
      }

      renderPendingApprovals();
    }

    function tickTimer() {
      if (!state.timerEndTime || state.status === 'LOBBY') return;

      const now = Date.now();
      const diffSeconds = Math.max(0, Math.floor((state.timerEndTime - now) / 1000));

      const mins = Math.floor(diffSeconds / 60).toString().padStart(2, '0');
      const secs = (diffSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;

      if (state.status === 'COUNTDOWN') {
        document.getElementById('timerLabel').innerText = 'GAME STARTING IN';
        if (diffSeconds === 0) {
          state.status = 'HUNTING';
          state.timerEndTime = Date.now() + (10 * 60 * 1000);
          syncToSupabase();
        }
      } else if (state.status === 'HUNTING') {
        document.getElementById('timerLabel').innerText = 'HIDING PHASE TIME';
        if (diffSeconds === 0) {
          document.getElementById('timerLabel').innerText = 'HUNT IS FULLY ACTIVE!';
        }
      }
    }

    function renderTeams() {
      const container = document.getElementById('activeTeamsList');
      container.innerHTML = state.teams.map(team => {
        let statusBadge = `<span class="status-badge status-hiding">HIDING</span>`;
        if (team.status === 'PENDING') statusBadge = `<span class="status-badge status-pending">CLAIMED CAUGHT</span>`;
        if (team.status === 'CAUGHT') statusBadge = `<span class="status-badge status-caught">HUNTER</span>`;

        const members = team.members.map(m => `${m.name} <span class="badge-batch">${m.batch}</span>`).join(', ');

        return `
          <div class="team-card ${team.status === 'CAUGHT' ? 'caught' : ''}">
            <div class="team-title">
              <span>${team.name}</span>
              ${statusBadge}
            </div>
            <div class="member-list">${members}</div>
            ${team.status === 'HIDING' ? `
              <button class="btn btn-red" style="padding: 10px; font-size: 0.85rem; min-height: 48px;" onclick="claimCaught('${team.id}')">
                🎯 CAUGHT THIS TEAM
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderPendingApprovals() {
      const container = document.getElementById('pendingApprovalsList');
      const pendingTeams = state.teams.filter(t => t.status === 'PENDING');

      if (pendingTeams.length === 0) {
        container.innerHTML = `<div style="font-size:0.85rem; color:var(--text-muted);">No pending catch approvals</div>`;
        return;
      }

      container.innerHTML = `
        <h4 style="color:var(--scary-red); margin-bottom: 8px;">PENDING CATCH APPROVALS</h4>
        ${pendingTeams.map(team => `
          <div style="background:#120404; padding:12px; border-radius:12px; margin-bottom:10px; border:2px solid var(--scary-red); box-shadow: inset 0 1px 0 rgba(255,60,40,.2);">
            <div style="font-weight:700; color:var(--amber);">${team.name}</div>
            <button class="btn btn-red" style="padding:8px; margin-top:6px; font-size:0.8rem; min-height:48px;" onclick="approveCatch('${team.id}')">
              APPROVE CATCH & TURN TO HUNTERS
            </button>
          </div>
        `).join('')}
      `;
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
