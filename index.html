<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Night Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* slate-800 with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-border {
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2), inset 0 0 10px rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .neon-border-red {
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2), inset 0 0 10px rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .animate-pulse-glow {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes slide-in-top {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-enter {
            animation: slide-in-top 0.3s ease-out forwards;
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden selection:bg-emerald-500 selection:text-white">

    <!-- Main App Container -->
    <main class="flex-1 relative w-full max-w-md mx-auto flex flex-col h-full z-10 px-4 py-6">
        
        <!-- Header area -->
        <header class="flex justify-center items-center py-4 mb-4">
            <h1 class="text-2xl font-bold tracking-widest text-emerald-400 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]">
                NIGHT HUNT
            </h1>
        </header>

        <!-- VIEW: Role Selection -->
        <div id="view-role" class="flex-1 flex flex-col justify-center gap-6 transition-opacity duration-300">
            <p class="text-center text-slate-400 mb-4">Select your operational role.</p>
            <button onclick="navTo('player-join')" class="glass-panel p-6 rounded-2xl flex flex-col items-center gap-3 active:scale-95 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="text-xl font-semibold tracking-wide">OPERATIVE (PLAYER)</span>
            </button>
            
            <button onclick="navTo('supervisor-login')" class="glass-panel p-6 rounded-2xl flex flex-col items-center gap-3 active:scale-95 transition-transform mt-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-400"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span class="text-xl font-semibold tracking-wide text-rose-400">SUPERVISOR</span>
            </button>
        </div>

        <!-- VIEW: Player Join -->
        <div id="view-player-join" class="hidden flex-1 flex flex-col justify-center transition-opacity duration-300">
            <div class="glass-panel p-8 rounded-3xl neon-border">
                <h2 class="text-xl font-bold mb-6 text-center tracking-widest text-emerald-400">INITIALIZE LINK</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Operative Name</label>
                        <input type="text" id="player-name-input" placeholder="Enter your alias" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors" autocomplete="off">
                    </div>
                    <button onclick="joinGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl tracking-widest uppercase transition-colors shadow-[0_0_15px_rgba(16,185,129,0.4)] active:scale-95">
                        Establish Connection
                    </button>
                    <button onclick="navTo('role')" class="w-full text-slate-500 text-sm hover:text-white transition-colors">Back</button>
                </div>
            </div>
        </div>

        <!-- VIEW: Player Dashboard -->
        <div id="view-player-dashboard" class="hidden flex-1 flex flex-col transition-opacity duration-300">
            <div class="glass-panel p-6 rounded-3xl neon-border flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                    <h2 class="text-lg font-bold tracking-widest text-emerald-400">YOUR PROFILE</h2>
                    <div id="player-status-badge" class="px-3 py-1 rounded-full text-xs font-bold tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 animate-pulse-glow">
                        ACTIVE
                    </div>
                </div>
                
                <div class="flex-1 flex flex-col justify-center items-center text-center space-y-8">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Operative Alias</p>
                        <p id="display-player-name" class="text-3xl font-light tracking-wide text-white">---</p>
                    </div>
                    
                    <div class="w-full max-w-[200px] h-px bg-gradient-to-r from-transparent via-slate-500 to-transparent"></div>
                    
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Assigned Team</p>
                        <p id="display-player-team" class="text-4xl font-mono font-bold text-emerald-400 tracking-tight drop-shadow-[0_0_10px_rgba(16,185,129,0.3)]">---</p>
                    </div>
                </div>
                
                <div class="mt-8 text-center">
                    <p class="text-xs text-slate-500">Awaiting supervisor directives...</p>
                </div>
            </div>
            <button onclick="leaveGame()" class="mt-6 text-slate-500 text-sm hover:text-white transition-colors">Disconnect</button>
        </div>

        <!-- VIEW: Supervisor Login -->
        <div id="view-supervisor-login" class="hidden flex-1 flex flex-col justify-center transition-opacity duration-300">
            <div class="glass-panel p-8 rounded-3xl border border-rose-500/30 shadow-[0_0_20px_rgba(244,63,94,0.1)]">
                <h2 class="text-xl font-bold mb-6 text-center tracking-widest text-rose-400">SECURE ACCESS</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Authentication PIN</label>
                        <!-- Mobile optimized numeric keypad trigger -->
                        <input type="password" id="supervisor-pin" inputmode="numeric" pattern="[0-9]*" placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl tracking-[0.5em] text-white focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-colors" autocomplete="off" maxlength="4">
                        <p class="text-center text-xs text-slate-500 mt-2">Hint: Use 1234 for demo</p>
                    </div>
                    <button onclick="supervisorLogin()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 rounded-xl tracking-widest uppercase transition-colors shadow-[0_0_15px_rgba(244,63,94,0.4)] active:scale-95">
                        Authenticate
                    </button>
                    <button onclick="navTo('role')" class="w-full text-slate-500 text-sm hover:text-white transition-colors">Cancel</button>
                </div>
            </div>
        </div>

        <!-- VIEW: Supervisor Dashboard -->
        <div id="view-supervisor-dashboard" class="hidden flex-1 flex flex-col h-full transition-opacity duration-300">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold tracking-widest text-rose-400">COMMAND CENTER</h2>
                <button onclick="navTo('role')" class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-lg">Logout</button>
            </div>
            
            <div class="flex-1 overflow-y-auto pb-6 pr-2 -mr-2" id="teams-list-container">
                <!-- Team cards will be injected here via JS -->
            </div>
        </div>

    </main>

    <!-- Mandatory Footer -->
    <footer class="w-full text-center py-4 text-xs font-mono tracking-widest text-slate-600 z-10 relative bg-gray-900/80 backdrop-blur-sm">
        Made by PIYUSH NANDI
    </footer>

    <!-- Custom Modal for Alerts (replacing native alert) -->
    <div id="custom-alert" class="fixed inset-0 z-50 flex items-start justify-center hidden pt-16 px-4 bg-black/40 backdrop-blur-[2px]">
        <div class="bg-slate-800 border-2 border-rose-500 rounded-2xl shadow-[0_10px_40px_rgba(226,29,72,0.4)] p-6 w-full max-w-sm modal-enter flex items-center gap-4">
            <div class="bg-rose-500/20 p-3 rounded-full flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-500"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            </div>
            <div class="flex-1">
                <h3 class="text-rose-400 font-bold uppercase tracking-wider text-sm mb-1">ELIMINATION ALERT</h3>
                <p id="alert-message" class="text-white font-medium"></p>
            </div>
            <button onclick="closeAlert()" class="self-start text-slate-400 hover:text-white p-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>

    <!-- Background Effects -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-emerald-900/20 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-900/20 blur-[100px]"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'night-hunt-demo';
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        
        // Define exact team list per requirements
        const TEAM_NAMES = ["Ghosts", "Ninjas", "Wolves", "Pirates", "Spies", "Bandits", "Hawks", "Outlaws"];

        // Application State
        let app = null;
        let db = null;
        let auth = null;
        let gameStateDocRef = null;
        let unsubscribeGameState = null;
        
        let localPlayer = {
            name: '',
            team: '',
            role: null // 'player' or 'supervisor'
        };

        let lastProcessedEventTime = 0;
        let globalTeamsState = {};

        // Audio Context for Beep
        let audioCtx = null;

        // Function to setup and play the sharp synth beep
        function playAlertBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // Ensure audio context is active (browsers require user interaction first)
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                // Synth configuration for a sharp, alarming beep
                oscillator.type = 'square'; // Harsh, digital sound
                
                // Start frequency and rapid drop
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                oscillator.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.3);
                
                // Volume envelope (fast attack, steady, fast decay)
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (err) {
                console.warn("Audio playback failed (likely due to missing user interaction):", err);
            }
        }

        // Initialize Audio context on first user interaction anywhere on the screen
        document.body.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }, { once: true });


        async function initializeFirebase() {
            try {
                let config = JSON.parse(firebaseConfigStr);
                if(Object.keys(config).length === 0) {
                    console.warn("Using fallback mock config for offline dev");
                    return false;
                }
                
                app = initializeApp(config);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authenticate (Rule 3: Auth before Queries)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                if (!auth.currentUser) {
                    console.error("Failed to authenticate.");
                    return false;
                }

                // Setup Document Reference (Rule 1: Strict Paths)
                // Using a single document for the whole game state to avoid complex queries
                const collectionPath = `artifacts/${appId}/public/data/state`;
                gameStateDocRef = doc(db, collectionPath, 'night_hunt');
                
                // Initialize default game state if it doesn't exist
                const docSnap = await getDoc(gameStateDocRef);
                if (!docSnap.exists()) {
                    let initialTeams = {};
                    TEAM_NAMES.forEach(t => initialTeams[t] = 'active');
                    await setDoc(gameStateDocRef, {
                        teams: initialTeams,
                        lastEvent: { type: 'init', team: '', timestamp: Date.now() }
                    });
                }
                return true;
            } catch (e) {
                console.error("Firebase Initialization Error:", e);
                return false;
            }
        }

        function startListeningToGameState() {
            if (!gameStateDocRef) return;
            
            if (unsubscribeGameState) {
                unsubscribeGameState();
            }

            unsubscribeGameState = onSnapshot(gameStateDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    globalTeamsState = data.teams || {};
                    
                    // Check for new elimination events
                    if (data.lastEvent && data.lastEvent.type === 'elimination' && data.lastEvent.timestamp > lastProcessedEventTime) {
                        
                        // Prevent initial load from triggering alerts
                        if (lastProcessedEventTime !== 0) {
                            handleEliminationEvent(data.lastEvent.team);
                        }
                        lastProcessedEventTime = data.lastEvent.timestamp;
                    } else if (lastProcessedEventTime === 0) {
                         // First load, just set the time
                         lastProcessedEventTime = data.lastEvent ? data.lastEvent.timestamp : Date.now();
                    }

                    // Update UI based on current role
                    if (localPlayer.role === 'player') {
                        updatePlayerDashboard();
                    } else if (localPlayer.role === 'supervisor') {
                        renderSupervisorDashboard();
                    }
                }
            }, (error) => {
                console.error("Error listening to game state:", error);
                showAlert("Connection lost. Trying to reconnect...");
            });
        }

        function handleEliminationEvent(eliminatedTeam) {
            // Trigger audio beep for ALL users
            playAlertBeep();
            
            // Show custom alert modal
            showAlert(`Team ${eliminatedTeam.toUpperCase()} has been eliminated from the hunt.`);
            
            // If the local player's team was eliminated, update their visual state
            if (localPlayer.role === 'player' && localPlayer.team === eliminatedTeam) {
                const badge = document.getElementById('player-status-badge');
                const card = badge.closest('.glass-panel');
                
                badge.textContent = 'ELIMINATED';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold tracking-wider bg-rose-500/20 text-rose-400 border border-rose-500/30';
                
                card.classList.remove('neon-border');
                card.classList.add('neon-border-red');
            }
        }

        window.joinGame = async function() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            if (!nameInput) {
                showAlert("Please enter your operative alias.");
                return;
            }

            // Randomly assign one of the 8 teams
            const randomTeamIndex = Math.floor(Math.random() * TEAM_NAMES.length);
            const assignedTeam = TEAM_NAMES[randomTeamIndex];

            localPlayer = {
                name: nameInput,
                team: assignedTeam,
                role: 'player'
            };

            // Setup Dashboard UI
            document.getElementById('display-player-name').textContent = localPlayer.name;
            document.getElementById('display-player-team').textContent = localPlayer.team;
            
            // Reset visual state in case of re-join
            const badge = document.getElementById('player-status-badge');
            const card = badge.closest('.glass-panel');
            badge.textContent = 'ACTIVE';
            badge.className = 'px-3 py-1 rounded-full text-xs font-bold tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 animate-pulse-glow';
            card.classList.remove('neon-border-red');
            card.classList.add('neon-border');

            navTo('player-dashboard');
            
            // Ensure audio context is ready
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Sync state to reflect accurate team status immediately
            updatePlayerDashboard();
        }

        function updatePlayerDashboard() {
            if (!localPlayer.team || !globalTeamsState[localPlayer.team]) return;
            
            const status = globalTeamsState[localPlayer.team];
            if (status === 'eliminated') {
                 const badge = document.getElementById('player-status-badge');
                 const card = badge.closest('.glass-panel');
                 if(badge.textContent !== 'ELIMINATED') {
                     badge.textContent = 'ELIMINATED';
                     badge.className = 'px-3 py-1 rounded-full text-xs font-bold tracking-wider bg-rose-500/20 text-rose-400 border border-rose-500/30';
                     card.classList.remove('neon-border');
                     card.classList.add('neon-border-red');
                 }
            }
        }

        window.leaveGame = function() {
            localPlayer = { name: '', team: '', role: null };
            document.getElementById('player-name-input').value = '';
            navTo('role');
        }

        window.supervisorLogin = function() {
            const pin = document.getElementById('supervisor-pin').value;
            // Simple hardcoded PIN for demo as requested
            if (pin === '1234') {
                localPlayer.role = 'supervisor';
                document.getElementById('supervisor-pin').value = '';
                navTo('supervisor-dashboard');
                renderSupervisorDashboard();
                
                // Ensure audio context is ready
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } else {
                showAlert("Invalid Authentication PIN.");
            }
        }

        function renderSupervisorDashboard() {
            const container = document.getElementById('teams-list-container');
            container.innerHTML = '';

            TEAM_NAMES.forEach(teamName => {
                const status = globalTeamsState[teamName] || 'active';
                const isEliminated = status === 'eliminated';
                
                const card = document.createElement('div');
                card.className = `glass-panel p-4 rounded-2xl mb-3 flex justify-between items-center transition-all ${isEliminated ? 'opacity-50 border-rose-500/30' : 'border-emerald-500/30'}`;
                
                const infoDiv = document.createElement('div');
                infoDiv.innerHTML = `
                    <h3 class="font-mono font-bold text-lg ${isEliminated ? 'text-rose-400 line-through' : 'text-emerald-400'}">${teamName}</h3>
                    <span class="text-xs uppercase tracking-wider text-slate-400">${status}</span>
                `;
                
                const actionBtn = document.createElement('button');
                if (isEliminated) {
                    actionBtn.className = "bg-slate-700 text-slate-400 px-4 py-2 rounded-lg font-bold text-xs uppercase cursor-not-allowed";
                    actionBtn.textContent = "Eliminated";
                    actionBtn.disabled = true;
                } else {
                    actionBtn.className = "bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider shadow-[0_0_10px_rgba(244,63,94,0.3)] active:scale-95 transition-all";
                    actionBtn.textContent = "Eliminate";
                    actionBtn.onclick = () => eliminateTeam(teamName);
                }

                card.appendChild(infoDiv);
                card.appendChild(actionBtn);
                container.appendChild(card);
            });
        }

        window.eliminateTeam = async function(teamName) {
            if (!gameStateDocRef || !db) {
                showAlert("Database connection error.");
                return;
            }

            try {
                // Update specific team status and trigger event for listeners
                const updateData = {
                    [`teams.${teamName}`]: 'eliminated',
                    lastEvent: {
                        type: 'elimination',
                        team: teamName,
                        timestamp: Date.now()
                    }
                };
                
                await updateDoc(gameStateDocRef, updateData);
                // Listeners will handle the UI updates and beep
                
            } catch (error) {
                console.error("Error eliminating team:", error);
                showAlert("Failed to eliminate team. Check connection.");
            }
        }

        // View Navigation Logic
        const views = ['role', 'player-join', 'player-dashboard', 'supervisor-login', 'supervisor-dashboard'];
        
        window.navTo = function(viewId) {
            views.forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) {
                    if (v === viewId) {
                        el.classList.remove('hidden');
                        // Small timeout to allow display:block to apply before changing opacity if we added transition classes
                    } else {
                        el.classList.add('hidden');
                    }
                }
            });
        }

        // Custom Alert Logic (replacing native alert())
        let alertTimeout;
        window.showAlert = function(message) {
            const modal = document.getElementById('custom-alert');
            const msgEl = document.getElementById('alert-message');
            
            msgEl.textContent = message;
            modal.classList.remove('hidden');
            
            // Auto close after 5 seconds
            clearTimeout(alertTimeout);
            alertTimeout = setTimeout(() => {
                closeAlert();
            }, 5000);
        }

        window.closeAlert = function() {
            const modal = document.getElementById('custom-alert');
            modal.classList.add('hidden');
        }

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', async () => {
            const isConnected = await initializeFirebase();
            if (isConnected) {
                startListeningToGameState();
            } else {
                showAlert("Running in local mode. Database sync unavailable.");
                // Setup mock state for UI testing
                TEAM_NAMES.forEach(t => globalTeamsState[t] = 'active');
            }
        });

    </script>
</body>
</html>
